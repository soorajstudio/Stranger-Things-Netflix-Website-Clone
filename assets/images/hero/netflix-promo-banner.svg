<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b12"/>
      <stop offset="48%" stop-color="#2b0c1e"/>
      <stop offset="100%" stop-color="#0d1124"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="72%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="0.65" y2="0">
      <stop offset="0%" stop-color="#140b10" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#140b10" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="160" fill="url(#bannerBg)"/>
  <rect width="1200" height="160" fill="url(#redGlow)"/>
  <rect width="1200" height="160" fill="url(#blueGlow)"/>
  <!-- Tilted cinematic poster collage on the right -->
  <g transform="translate(740, -18) rotate(-10)" opacity="0.48">
    <rect x="0" y="15" width="84" height="125" rx="8" fill="#3f111c" stroke="#e50914" stroke-opacity="0.4"/>
    <rect x="98" y="4" width="84" height="125" rx="8" fill="#1b263b" stroke="#60a5fa" stroke-opacity="0.35"/>
    <rect x="196" y="18" width="84" height="125" rx="8" fill="#2e1065" stroke="#c084fc" stroke-opacity="0.35"/>
    <rect x="294" y="6" width="84" height="125" rx="8" fill="#450a0a" stroke="#f87171" stroke-opacity="0.4"/>
    <rect x="392" y="20" width="84" height="125" rx="8" fill="#0f2922" stroke="#34d399" stroke-opacity="0.35"/>
  </g>
  <rect width="1200" height="160" fill="url(#fadeLeft)"/>
</svg>
